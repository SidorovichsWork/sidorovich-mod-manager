name: Bug report / Error / Ошибка
description: Report an app problem. English, Spanish and Russian are welcome.
body:
  - type: input
    id: app-version
    attributes:
      label: App version / Versión / Версия
      placeholder: 0.2.0-beta.1
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version / Dispositivo y Android / Устройство и Android
    validations:
      required: true
  - type: input
    id: port
    attributes:
      label: Android port and version / Port y versión / Порт и версия
  - type: input
    id: mod
    attributes:
      label: Mod name and version / Mod y versión / Мод и версия
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected result / Pasos y resultado esperado / Шаги и ожидаемый результат
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and error / Resultado y error / Результат и ошибка
      description: Remove personal information from logs. Do not upload game files or complete mod archives.
    validations:
      required: true
